<style>
@page { size: A4; margin: 16mm 15mm; }
html { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
body {
  font-family: "PingFang SC", "Helvetica Neue", Helvetica, "Arial Unicode MS", sans-serif;
  font-size: 10.5pt;
  line-height: 1.6;
  color: #1f2328;
  max-width: none;
  margin: 0;
}
h1 { font-size: 18pt; margin: 0 0 2pt; color: #1a3d7c; line-height: 1.3; }
h1 + h1 { font-size: 13pt; color: #4a5a78; font-weight: 500; margin-bottom: 10pt; }
h2 { font-size: 14pt; color: #1a3d7c; border-bottom: 1.5px solid #c9d4ea; padding-bottom: 3pt; margin-top: 18pt; }
h3 { font-size: 11.5pt; color: #24324d; margin-top: 14pt; }
h2, h3 { break-after: avoid; }
p, li { orphans: 3; widows: 3; }
blockquote {
  margin: 8pt 0; padding: 6pt 10pt;
  background: #f3f6fc; border-left: 3px solid #7b96cc; color: #2c3a52;
}
blockquote p { margin: 3pt 0; }
table { border-collapse: collapse; width: 100%; margin: 8pt 0; font-size: 10pt; }
tr { break-inside: avoid; }
thead { display: table-header-group; }
th, td { border: 1px solid #d0d7de; padding: 4pt 6pt; text-align: left; vertical-align: top; }
th { background: #eaf0fa; }
tr:nth-child(even) td { background: #fafbfd; }
code, pre { font-family: "Menlo", "PingFang SC", monospace; font-size: 9pt; }
pre { background: #f6f8fa; padding: 8pt; border-radius: 4px; white-space: pre; overflow: hidden; break-inside: avoid; }
hr { border: none; border-top: 1px solid #d0d7de; margin: 14pt 0; }
ul.task-list, ul:has(> li > input[type=checkbox]) { list-style: none; padding-left: 4pt; }
input[type=checkbox] { margin-right: 6pt; }
a { color: #1a5bc4; text-decoration: none; }
em { color: #3b4a66; }
.lesson-break { break-before: page; }
</style>
<style>
.vocab table { table-layout: fixed; }
.vocab th:nth-child(1) { width: 24%; }
.vocab th:nth-child(2) { width: 18%; }
.vocab th:nth-child(3) { width: 17%; }
.vocab th:nth-child(4) { width: 19%; }
.vocab th:nth-child(5) { width: 22%; }
</style>
